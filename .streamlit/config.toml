# ===== 화면 테마 (모든 페이지에 같이 적용) =====
[theme]
base = "light"                            # 밝은 테마를 바탕으로
backgroundColor = "#F3F5F8"             # 본문 배경: 연한 회색
secondaryBackgroundColor = "#FFFFFF"    # 사이드바·입력칸·접기 칸 배경: 흰색
primaryColor = "#1F3A5F"                # 슬라이더·라디오·선택 강조색: 남색
textColor = "#1E293B"                   # 글자: 진한 남회색